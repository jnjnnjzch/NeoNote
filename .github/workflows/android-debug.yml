name: Android Debug Build

on:
  push:
    branches:
      - codex/neonote-v2-blank-architecture
  pull_request:
    branches:
      - codex/neonote-v2-blank-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Apply editor history migration
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/add-clean-undo-redo-history' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 scripts/apply_editor_history_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/neonote/NeoNoteEditorController.kt
          git commit -m "Add bounded document undo and redo history"
          git push origin HEAD:codex/add-clean-undo-redo-history

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run tests
        run: ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

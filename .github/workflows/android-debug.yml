name: Android Debug Build

on:
  push:
    branches:
      - codex/neonote-v2-blank-architecture
  pull_request:
    branches:
      - codex/neonote-v2-blank-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Apply unified table cell migration
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/unify-table-cell-richcontent-editor' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/apply-unified-cell-editor.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_unified_cell_editor.py
          python3 /tmp/apply_unified_cell_editor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/neonote/model/RichContent.kt \
                  app/src/main/java/com/neonote/engine/RichContentEngine.kt \
                  app/src/main/java/com/neonote/engine/RichContentEditorSession.kt \
                  app/src/main/java/com/neonote/TableBlockEditor.kt \
                  app/src/main/java/com/neonote/TableCellEditor.kt \
                  app/src/test/kotlin/com/neonote/RichContentNestedTest.kt
          git commit -m "Unify table cell RichContent paragraph editing"
          git push origin HEAD:codex/unify-table-cell-richcontent-editor

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run tests
        run: ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

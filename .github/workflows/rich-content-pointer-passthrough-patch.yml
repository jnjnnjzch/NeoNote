name: Apply rich content pointer passthrough

on:
  push:
    branches:
      - agent/product-quality-loop
    paths:
      - scripts/rich_content_pointer_passthrough_patch.py
      - .github/workflows/rich-content-pointer-passthrough-patch.yml

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-quality-loop
          fetch-depth: 0

      - name: Apply pointer passthrough
        run: python3 scripts/rich_content_pointer_passthrough_patch.py

      - name: Remove temporary patch files
        run: |
          git rm -f scripts/rich_content_pointer_passthrough_patch.py .github/workflows/rich-content-pointer-passthrough-patch.yml

      - name: Commit corrected clean tree
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git commit -m 'Pass navigation gestures through rich content'
          git push origin HEAD:agent/product-quality-loop

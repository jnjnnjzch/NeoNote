name: Apply loop 22 editor bridges

on:
  push:
    branches: [loop/product-hardening]
    paths: [.github/workflows/apply-loop22-editor-bridges.yml]

permissions:
  contents: write

concurrency:
  group: neonote-loop22-editor-bridges
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/product-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed editor bridge patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/editor-bridges.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/editor-bridges.b64 > /tmp/editor-bridges.patch
          echo '8b18a64c0a0af69c7e6439d8078f598daa0ae86d1f54be16607f5207122392a1  /tmp/editor-bridges.patch' | sha256sum --check --strict
          git apply --check /tmp/editor-bridges.patch
          git apply /tmp/editor-bridges.patch
          rm .github/workflows/apply-loop22-editor-bridges.yml
          git diff --check
          git config user.name 'NeoNote hardening loop'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: connect rich clipboard and table tab navigation'
          git push origin HEAD:loop/product-hardening

          cat > app/src/main/java/com/neonote/RichContentBoxView.kt <<'KOTLIN'
          package com.neonote

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.defaultMinSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.layout.wrapContentHeight
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalFocusManager
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import com.neonote.engine.RichContentLayoutDefaults
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.math.roundToInt

          @Composable
          internal fun RichContentBoxView(
              box: RichContentBox,
              selected: Boolean,
              selectionMode: Boolean,
              controller: NeoNoteEditorController,
          ) {
              val density = LocalDensity.current
              val focusManager = LocalFocusManager.current
              val contentInteractionDisabled = controller.state.currentTool != EditorTool.Text
              LaunchedEffect(selectionMode, selected) {
                  if (selectionMode || selected) focusManager.clearFocus()
              }

              val borderColor = when {
                  selected -> Color(0xFF2563EB)
                  box.isFocused -> Color(0xFF7C3AED)
                  else -> Color(0xFFE2E8F0)
              }
              val shape = RoundedCornerShape(14.dp)
              val boxWidth = with(density) { box.size.width.toDp() }
              val persistedHeight = with(density) { box.size.height.toDp() }
              val interactionModifier = if (selectionMode) {
                  Modifier.pointerInput(box.id, selectionMode) {
                      awaitEachGesture {
                          awaitFirstDown(requireUnconsumed = false)
                          controller.activateRichContentBox(box.id)
                      }
                  }
              } else Modifier
              val sizingModifier = if (box.autoSizeHeight) {
                  Modifier.defaultMinSize(minHeight = 64.dp).wrapContentHeight().onSizeChanged { measured ->
                      controller.updateRichContentBoxMeasuredHeight(box.id, measured.height.toFloat())
                  }
              } else Modifier.height(persistedHeight)

              Box(
                  modifier = Modifier
                      .offset { IntOffset(box.position.x.roundToInt(), box.position.y.roundToInt()) }
                      .width(boxWidth)
                      .then(sizingModifier)
                      .clip(shape)
                      .background(Color.White)
                      .border(if (selected || box.isFocused) 2.dp else 1.dp, borderColor, shape)
                      .padding(RichContentLayoutDefaults.BoxChromePadding.dp)
                      .then(interactionModifier),
              ) {
                  if (!box.isFocused) {
                      RichContentRenderer(
                          content = box.content,
                          selectionMode = selectionMode || contentInteractionDisabled,
                          selected = selected,
                          onFocus = { controller.activateRichContentBox(box.id) },
                          onToggleTodoChecked = { controller.toggleRichContentTodoCheckedState(box.id, it) },
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                          selectedObjectBlockIndex = controller.selectedRichContentObjectBlockIndex(box.id),
                          onObjectBlockFocus = { controller.selectRichContentObjectBlock(box.id, it) },
                      )
                  } else {
                      RichContentEditor(
                          box = box,
                          selectionMode = selectionMode,
                          selected = selected,
                          controller = controller,
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                      )
                  }
              }
          }
          KOTLIN

          cat > app/src/test/kotlin/com/neonote/RichContentBoxSizingTest.kt <<'KOTLIN'
          package com.neonote

          import com.neonote.model.CanvasPoint
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.test.Test
          import kotlin.test.assertTrue

          class RichContentBoxSizingTest {
              @Test
              fun newTextBoxUsesReadableScreenAwareWidth() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(1600, 2.5f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))
                  val box = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(box.size.width >= 800f)
                  assertTrue(box.size.height >= 150f)
              }

              @Test
              fun measuredComposeContentDrivesAutoHeight() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(1600, 2f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))
                  val id = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single().id
                  controller.updateRichContentBoxMeasuredHeight(id, 460f)
                  val grown = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(grown.size.height >= 460f)
              }
          }
          KOTLIN

      - name: Commit feature repair and remove temporary feature workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-maintenance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: make rich content containers grow with actual UI content'
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Remove this bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${DEFAULT_BRANCH}
          git checkout -B ${DEFAULT_BRANCH} origin/${DEFAULT_BRANCH}
          git rm .github/workflows/run-feature-maintenance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'chore: remove one-shot sizing repair workflow'
          git push origin HEAD:${DEFAULT_BRANCH}

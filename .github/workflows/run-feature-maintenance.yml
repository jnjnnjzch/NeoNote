name: Apply editor sizing repair once

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [.github/workflows/run-feature-maintenance.yml]

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/complete-editor-rc
  DEFAULT_BRANCH: codex/neonote-v2-blank-architecture

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0

      - name: Apply guarded source transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new)

          p = Path('app/src/main/java/com/neonote/NeoNoteEditorController.kt')
          text = p.read_text()
          text = once(text,
              'private const val DefaultBoxWidth = 360f\nprivate const val DefaultBoxHeight = 120f',
              'private const val DefaultBoxWidth = 960f\nprivate const val DefaultBoxHeight = 220f\nprivate const val DefaultViewportWidthPx = 1280f\nprivate const val MinimumTextBoxWidthDp = 320f\nprivate const val PreferredTextBoxWidthDp = 520f\nprivate const val MaximumTextBoxWidthDp = 760f\nprivate const val MinimumTextBoxHeightDp = 64f\nprivate const val TextBoxScreenMarginDp = 20f',
              'controller constants')
          text = once(text,
              '    private var richContentInteractionRevision by mutableStateOf(0)\n',
              '    private var richContentInteractionRevision by mutableStateOf(0)\n    private var displayDensity: Float = 2f\n    private var viewportWidthScreenPx: Float = DefaultViewportWidthPx\n',
              'controller display metrics fields')

          pattern = re.compile(r'    public fun focusOrCreateRichContentBox\(documentPosition: CanvasPoint\) \{.*?\n    \}\n\n    public fun insertFloatingImage', re.S)
          replacement = '''    public fun updateViewportMetrics(widthPx: Int, density: Float) {
              if (widthPx > 0) viewportWidthScreenPx = widthPx.toFloat()
              if (density.isFinite() && density > 0f) displayDensity = density
          }

          public fun focusOrCreateRichContentBox(documentPosition: CanvasPoint) {
              val existing = currentCanvas.topMostObjectAt(documentPosition) as? RichContentBox
              if (existing != null) {
                  activateRichContentBox(existing.id)
                  return
              }
              if (state.currentTool != EditorTool.Text) return
              val zoom = state.viewport.zoomScale.coerceAtLeast(MinZoomScale)
              val minimumWidth = MinimumTextBoxWidthDp * displayDensity / zoom
              val preferredWidth = PreferredTextBoxWidthDp * displayDensity / zoom
              val maximumWidth = MaximumTextBoxWidthDp * displayDensity / zoom
              val availableWidth = (viewportWidthScreenPx - TextBoxScreenMarginDp * 2f * displayDensity) / zoom
              val width = preferredWidth.coerceIn(minimumWidth, maximumWidth)
                  .coerceAtMost(availableWidth.coerceAtLeast(minimumWidth))
              val visibleLeft = -state.viewport.panOffsetX / zoom
              val visibleRight = (viewportWidthScreenPx - state.viewport.panOffsetX) / zoom
              val margin = TextBoxScreenMarginDp * displayDensity / zoom
              val maximumLeft = (visibleRight - width - margin).coerceAtLeast(visibleLeft + margin)
              val position = documentPosition.copy(
                  x = documentPosition.x.coerceIn(visibleLeft + margin, maximumLeft),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
              val box = RichContentBox(
                  id = nextRichContentBoxId(),
                  position = position,
                  size = CanvasSize(width, maxOf(DefaultBoxHeight / zoom, minimumHeight)),
                  zIndex = (currentCanvas.objects.maxOfOrNull { it.zIndex } ?: 0) + 1,
                  content = RichContent(),
                  isFocused = true,
              )
              val added = canvasEngine.execute(currentCanvas, CanvasCommand.AddObject(box)) as CanvasCommandResult.ObjectAdded
              state = state.copy(
                  document = state.document.withCanvas(added.canvas.setFocusedRichContentBox(box.id)),
                  focusedRichContentBoxId = box.id,
                  selection = SelectionState(),
                  currentTool = EditorTool.Text,
              )
          }

          public fun insertFloatingImage'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'focus/create function: expected 1 match, found {count}')

          text = once(text,
              '            val measured = if (result.box.autoSizeHeight) richContentMeasurer.resizeBoxToMeasuredContent(result.box) else result.box\n',
              '            val measured = if (result.box.autoSizeHeight) {\n                val predicted = richContentMeasurer.resizeBoxToMeasuredContent(result.box)\n                predicted.copy(size = predicted.size.copy(\n                    height = maxOf(result.box.size.height, predicted.size.height),\n                ))\n            } else result.box\n',
              'editBox predicted size')
          text = once(text,
              '    private fun editorSessionFor(boxId: String, box: RichContentBox): RichContentEditorSession =\n',
              '''    public fun updateRichContentBoxMeasuredHeight(boxId: String, measuredHeight: Float) {
              val targetHeight = measuredHeight.coerceAtLeast(MinimumTextBoxHeightDp * displayDensity)
              val box = richContentBox(boxId) ?: return
              if (!box.autoSizeHeight || kotlin.math.abs(box.size.height - targetHeight) < 1f) return
              val canvas = currentCanvas.updateRichContentBox(boxId) { current ->
                  current.copy(size = current.size.copy(height = targetHeight))
              }
              replaceStateWithoutRecordingHistory {
                  state = state.copy(document = state.document.withCanvas(canvas))
              }
          }

          private fun editorSessionFor(boxId: String, box: RichContentBox): RichContentEditorSession =
          ''',
              'measured height method')
          text = once(text,
              '            if (objectValue is RichContentBox && objectValue.autoSizeHeight) richContentMeasurer.resizeBoxToMeasuredContent(objectValue)\n            else objectValue\n',
              '            if (objectValue is RichContentBox && objectValue.autoSizeHeight) {\n                val measured = richContentMeasurer.resizeBoxToMeasuredContent(objectValue)\n                measured.copy(size = measured.size.copy(\n                    height = maxOf(objectValue.size.height, measured.size.height),\n                ))\n            } else objectValue\n',
              'load measured height')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/RichContentEditor.kt')
          text = p.read_text()
          text = once(text, 'import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.wrapContentHeight\n', 'editor import')
          text = once(text, 'modifier = modifier.fillMaxSize().padding(', 'modifier = modifier.fillMaxWidth().wrapContentHeight().padding(', 'editor column')
          text = once(text, 'modifier = Modifier.fillMaxSize(),', 'modifier = Modifier.fillMaxWidth().wrapContentHeight(),', 'unified editor modifier')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/UnifiedRichTextEditor.kt')
          text = p.read_text()
          text = once(text, 'import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.defaultMinSize\nimport androidx.compose.foundation.layout.fillMaxWidth\n', 'unified imports')
          text = once(text, 'import androidx.compose.ui.unit.sp\n', 'import androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n', 'unified dp import')
          text = once(text, '            .fillMaxSize()\n            .focusRequester(requester)', '            .fillMaxWidth()\n            .defaultMinSize(minHeight = 48.dp)\n            .focusRequester(requester)', 'unified field size')
          text = once(text, '            Box(Modifier.fillMaxSize()) {', '            Box(Modifier.fillMaxWidth().defaultMinSize(minHeight = 48.dp)) {', 'unified decoration size')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/InfiniteCanvasViewport.kt')
          text = p.read_text()
          text = once(text, 'import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.heightIn\n', 'viewport layout imports')
          text = once(text, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.widthIn\n', 'viewport width import')
          text = once(text, 'import androidx.compose.ui.graphics.graphicsLayer\n', 'import androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.layout.onSizeChanged\nimport androidx.compose.ui.platform.LocalDensity\n', 'viewport density imports')
          text = once(text, '    val platformSnapshotStore = remember { PlatformSnapshotStore() }\n', '    val platformSnapshotStore = remember { PlatformSnapshotStore() }\n    val density = LocalDensity.current\n', 'viewport density')
          text = once(text, '        modifier = modifier\n            .background(Color(0xFFF9F8FC))\n', '        modifier = modifier\n            .background(Color(0xFFF9F8FC))\n            .onSizeChanged { controller.updateViewportMetrics(it.width, density.density) }\n', 'viewport size report')
          text = once(text,
              '        if (controller.currentCanvas.objects.isEmpty() && controller.currentCanvas.inkLayer.strokes.isEmpty()) {\n',
              '''        val focusedBoxId = controller.state.focusedRichContentBoxId
              if (controller.state.currentTool == EditorTool.Text && focusedBoxId != null) {
                  RichContentToolbar(
                      boxId = focusedBoxId,
                      controller = controller,
                      modifier = Modifier
                          .align(Alignment.TopCenter)
                          .padding(horizontal = 12.dp, vertical = 10.dp)
                          .fillMaxWidth()
                          .widthIn(max = 920.dp)
                          .heightIn(min = 50.dp),
                  )
              }

              if (controller.currentCanvas.objects.isEmpty() && controller.currentCanvas.inkLayer.strokes.isEmpty()) {
          ''',
              'screen-space toolbar')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/RichContentToolbar.kt')
          text = p.read_text()
          text = once(text, 'import androidx.compose.foundation.layout.Box\n', 'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.fillMaxWidth\n', 'toolbar import')
          text = once(text, '        modifier = modifier.focusProperties { canFocus = false },', '        modifier = modifier.fillMaxWidth().focusProperties { canFocus = false },', 'toolbar width')
          p.write_text(text)
          PY

          cat > app/src/main/java/com/neonote/RichContentBoxView.kt <<'KOTLIN'
          package com.neonote

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.defaultMinSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.layout.wrapContentHeight
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalFocusManager
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import com.neonote.engine.RichContentLayoutDefaults
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.math.roundToInt

          @Composable
          internal fun RichContentBoxView(
              box: RichContentBox,
              selected: Boolean,
              selectionMode: Boolean,
              controller: NeoNoteEditorController,
          ) {
              val density = LocalDensity.current
              val focusManager = LocalFocusManager.current
              val contentInteractionDisabled = controller.state.currentTool != EditorTool.Text
              LaunchedEffect(selectionMode, selected) {
                  if (selectionMode || selected) focusManager.clearFocus()
              }
              val borderColor = when {
                  selected -> Color(0xFF2563EB)
                  box.isFocused -> Color(0xFF7C3AED)
                  else -> Color(0xFFE2E8F0)
              }
              val shape = RoundedCornerShape(14.dp)
              val boxWidth = with(density) { box.size.width.toDp() }
              val persistedHeight = with(density) { box.size.height.toDp() }
              val interactionModifier = if (selectionMode) {
                  Modifier.pointerInput(box.id, selectionMode) {
                      awaitEachGesture {
                          awaitFirstDown(requireUnconsumed = false)
                          controller.activateRichContentBox(box.id)
                      }
                  }
              } else Modifier
              val sizingModifier = if (box.autoSizeHeight) {
                  Modifier.defaultMinSize(minHeight = 64.dp).wrapContentHeight().onSizeChanged {
                      controller.updateRichContentBoxMeasuredHeight(box.id, it.height.toFloat())
                  }
              } else Modifier.height(persistedHeight)

              Box(
                  modifier = Modifier
                      .offset { IntOffset(box.position.x.roundToInt(), box.position.y.roundToInt()) }
                      .width(boxWidth)
                      .then(sizingModifier)
                      .clip(shape)
                      .background(Color.White)
                      .border(if (selected || box.isFocused) 2.dp else 1.dp, borderColor, shape)
                      .padding(RichContentLayoutDefaults.BoxChromePadding.dp)
                      .then(interactionModifier),
              ) {
                  if (!box.isFocused) {
                      RichContentRenderer(
                          content = box.content,
                          selectionMode = selectionMode || contentInteractionDisabled,
                          selected = selected,
                          onFocus = { controller.activateRichContentBox(box.id) },
                          onToggleTodoChecked = { controller.toggleRichContentTodoCheckedState(box.id, it) },
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                          selectedObjectBlockIndex = controller.selectedRichContentObjectBlockIndex(box.id),
                          onObjectBlockFocus = { controller.selectRichContentObjectBlock(box.id, it) },
                      )
                  } else {
                      RichContentEditor(
                          box = box,
                          selectionMode = selectionMode,
                          selected = selected,
                          controller = controller,
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                      )
                  }
              }
          }
          KOTLIN

          cat > app/src/test/kotlin/com/neonote/RichContentBoxSizingTest.kt <<'KOTLIN'
          package com.neonote

          import com.neonote.model.CanvasPoint
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.test.Test
          import kotlin.test.assertTrue

          class RichContentBoxSizingTest {
              @Test
              fun newTextBoxUsesReadableScreenAwareWidth() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(1600, 2.5f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))
                  val box = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(box.size.width >= 800f)
                  assertTrue(box.size.height >= 150f)
              }

              @Test
              fun measuredComposeContentDrivesAutoHeight() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(1600, 2f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))
                  val id = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single().id
                  controller.updateRichContentBoxMeasuredHeight(id, 460f)
                  val grown = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(grown.size.height >= 460f)
              }
          }
          KOTLIN

      - name: Commit repaired feature and remove temporary feature workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-maintenance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: make rich content containers grow with actual UI content'
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Remove this bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${DEFAULT_BRANCH}
          git checkout -B ${DEFAULT_BRANCH} origin/${DEFAULT_BRANCH}
          git rm .github/workflows/run-feature-maintenance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'chore: remove one-shot sizing repair workflow'
          git push origin HEAD:${DEFAULT_BRANCH}

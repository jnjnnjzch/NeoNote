name: One-shot repository maintenance

on:
  push:
    branches: [feature/complete-editor-rc]
    paths: [.github/workflows/one-shot-maintenance.yml]

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/complete-editor-rc
  DEFAULT_BRANCH: codex/neonote-v2-blank-architecture

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Delete stale branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | while read -r branch; do
            case "$branch" in
              HEAD|"$DEFAULT_BRANCH"|"$FEATURE_BRANCH") continue ;;
            esac
            git push origin --delete "$branch" || true
          done

      - name: Repair text container sizing and contextual toolbar
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/neonote/RichContentBoxView.kt <<'KOTLIN'
          package com.neonote

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.defaultMinSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.layout.wrapContentHeight
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalFocusManager
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import com.neonote.engine.RichContentLayoutDefaults
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.math.roundToInt

          /**
           * A OneNote-like content container: width is user/canvas owned while height follows
           * the actual Compose content measurement. The formatting toolbar is rendered by the
           * viewport in screen space, so it is never clipped by or scaled with this container.
           */
          @Composable
          internal fun RichContentBoxView(
              box: RichContentBox,
              selected: Boolean,
              selectionMode: Boolean,
              controller: NeoNoteEditorController,
          ) {
              val density = LocalDensity.current
              val focusManager = LocalFocusManager.current
              val contentInteractionDisabled = controller.state.currentTool != EditorTool.Text
              LaunchedEffect(selectionMode, selected) {
                  if (selectionMode || selected) focusManager.clearFocus()
              }

              val borderColor = when {
                  selected -> Color(0xFF2563EB)
                  box.isFocused -> Color(0xFF7C3AED)
                  else -> Color(0xFFE2E8F0)
              }
              val borderWidth = if (selected || box.isFocused) 2.dp else 1.dp
              val shape = RoundedCornerShape(14.dp)
              val boxWidth = with(density) { box.size.width.toDp() }
              val persistedHeight = with(density) { box.size.height.toDp() }

              val interactionModifier = if (selectionMode) {
                  Modifier.pointerInput(box.id, selectionMode) {
                      awaitEachGesture {
                          awaitFirstDown(requireUnconsumed = false)
                          controller.activateRichContentBox(box.id)
                      }
                  }
              } else Modifier

              val sizingModifier = if (box.autoSizeHeight) {
                  Modifier
                      .defaultMinSize(minHeight = 64.dp)
                      .wrapContentHeight()
                      .onSizeChanged { measured ->
                          controller.updateRichContentBoxMeasuredHeight(box.id, measured.height.toFloat())
                      }
              } else {
                  Modifier.height(persistedHeight)
              }

              Box(
                  modifier = Modifier
                      .offset { IntOffset(box.position.x.roundToInt(), box.position.y.roundToInt()) }
                      .width(boxWidth)
                      .then(sizingModifier)
                      .clip(shape)
                      .background(Color.White)
                      .border(borderWidth, borderColor, shape)
                      .padding(RichContentLayoutDefaults.BoxChromePadding.dp)
                      .then(interactionModifier),
              ) {
                  if (!box.isFocused) {
                      RichContentRenderer(
                          content = box.content,
                          selectionMode = selectionMode || contentInteractionDisabled,
                          selected = selected,
                          onFocus = { controller.activateRichContentBox(box.id) },
                          onToggleTodoChecked = { blockIndex ->
                              controller.toggleRichContentTodoCheckedState(box.id, blockIndex)
                          },
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                          selectedObjectBlockIndex = controller.selectedRichContentObjectBlockIndex(box.id),
                          onObjectBlockFocus = { blockIndex ->
                              controller.selectRichContentObjectBlock(box.id, blockIndex)
                          },
                      )
                  } else {
                      RichContentEditor(
                          box = box,
                          selectionMode = selectionMode,
                          selected = selected,
                          controller = controller,
                          modifier = Modifier.fillMaxWidth().wrapContentHeight(),
                      )
                  }
              }
          }
          KOTLIN

          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          controller = Path('app/src/main/java/com/neonote/NeoNoteEditorController.kt')
          text = controller.read_text()
          text = text.replace(
              'private const val DefaultBoxWidth = 360f\nprivate const val DefaultBoxHeight = 120f',
              'private const val DefaultBoxWidth = 960f\nprivate const val DefaultBoxHeight = 220f\nprivate const val DefaultViewportWidthPx = 1280f\nprivate const val MinimumTextBoxWidthDp = 320f\nprivate const val PreferredTextBoxWidthDp = 520f\nprivate const val MaximumTextBoxWidthDp = 760f\nprivate const val MinimumTextBoxHeightDp = 64f\nprivate const val TextBoxScreenMarginDp = 20f',
          )
          marker = '    private var richContentInteractionRevision by mutableStateOf(0)\n'
          if marker not in text:
              raise SystemExit('controller metrics insertion anchor missing')
          text = text.replace(marker, marker + '    private var displayDensity: Float = 2f\n    private var viewportWidthScreenPx: Float = DefaultViewportWidthPx\n')

          old = '''    public fun focusOrCreateRichContentBox(documentPosition: CanvasPoint) {
              val existing = currentCanvas.topMostObjectAt(documentPosition) as? RichContentBox
              if (existing != null) {
                  activateRichContentBox(existing.id)
                  return
              }
              if (state.currentTool != EditorTool.Text) return
              val box = RichContentBox(
                  id = nextRichContentBoxId(),
                  position = documentPosition,
                  size = CanvasSize(DefaultBoxWidth, DefaultBoxHeight),
                  zIndex = (currentCanvas.objects.maxOfOrNull { it.zIndex } ?: 0) + 1,
                  content = RichContent(),
                  isFocused = true,
              )
          '''
          new = '''    public fun updateViewportMetrics(widthPx: Int, density: Float) {
              if (widthPx > 0) viewportWidthScreenPx = widthPx.toFloat()
              if (density.isFinite() && density > 0f) displayDensity = density
          }

              public fun focusOrCreateRichContentBox(documentPosition: CanvasPoint) {
              val existing = currentCanvas.topMostObjectAt(documentPosition) as? RichContentBox
              if (existing != null) {
                  activateRichContentBox(existing.id)
                  return
              }
              if (state.currentTool != EditorTool.Text) return
              val zoom = state.viewport.zoomScale.coerceAtLeast(MinZoomScale)
              val minimumWidth = MinimumTextBoxWidthDp * displayDensity / zoom
              val preferredWidth = PreferredTextBoxWidthDp * displayDensity / zoom
              val maximumWidth = MaximumTextBoxWidthDp * displayDensity / zoom
              val availableWidth = (viewportWidthScreenPx - TextBoxScreenMarginDp * 2f * displayDensity) / zoom
              val width = preferredWidth.coerceIn(minimumWidth, maximumWidth).coerceAtMost(availableWidth.coerceAtLeast(minimumWidth))
              val visibleLeft = -state.viewport.panOffsetX / zoom
              val visibleRight = (viewportWidthScreenPx - state.viewport.panOffsetX) / zoom
              val margin = TextBoxScreenMarginDp * displayDensity / zoom
              val maximumLeft = (visibleRight - width - margin).coerceAtLeast(visibleLeft + margin)
              val position = documentPosition.copy(x = documentPosition.x.coerceIn(visibleLeft + margin, maximumLeft))
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
              val box = RichContentBox(
                  id = nextRichContentBoxId(),
                  position = position,
                  size = CanvasSize(width, maxOf(DefaultBoxHeight / zoom, minimumHeight)),
                  zIndex = (currentCanvas.objects.maxOfOrNull { it.zIndex } ?: 0) + 1,
                  content = RichContent(),
                  isFocused = true,
              )
          '''
          if old not in text:
              raise SystemExit('focus/create anchor missing')
          text = text.replace(old, new)

          old = '''            val result = edit(editorSessionFor(boxId, box))
                      val measured = if (result.box.autoSizeHeight) richContentMeasurer.resizeBoxToMeasuredContent(result.box) else result.box
                      updatedBox = measured
                      measured
          '''
          new = '''            val result = edit(editorSessionFor(boxId, box))
                      val measured = if (result.box.autoSizeHeight) {
                          val predicted = richContentMeasurer.resizeBoxToMeasuredContent(result.box)
                          predicted.copy(size = predicted.size.copy(height = maxOf(result.box.size.height, predicted.size.height)))
                      } else result.box
                      updatedBox = measured
                      measured
          '''
          if old not in text:
              raise SystemExit('editBox sizing anchor missing')
          text = text.replace(old, new)

          insert_before = '    private fun editorSessionFor(boxId: String, box: RichContentBox): RichContentEditorSession =\n'
          method = '''    public fun updateRichContentBoxMeasuredHeight(boxId: String, measuredHeight: Float) {
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity
              val targetHeight = measuredHeight.coerceAtLeast(minimumHeight)
              val box = richContentBox(boxId) ?: return
              if (!box.autoSizeHeight || kotlin.math.abs(box.size.height - targetHeight) < 1f) return
              val canvas = currentCanvas.updateRichContentBox(boxId) { current ->
                  current.copy(size = current.size.copy(height = targetHeight))
              }
              replaceStateWithoutRecordingHistory {
                  state = state.copy(document = state.document.withCanvas(canvas))
              }
          }

          '''
          if insert_before not in text:
              raise SystemExit('measured height insertion anchor missing')
          text = text.replace(insert_before, method + insert_before)

          old = '''            if (objectValue is RichContentBox && objectValue.autoSizeHeight) richContentMeasurer.resizeBoxToMeasuredContent(objectValue)
                      else objectValue
          '''
          new = '''            if (objectValue is RichContentBox && objectValue.autoSizeHeight) {
                          val measured = richContentMeasurer.resizeBoxToMeasuredContent(objectValue)
                          measured.copy(size = measured.size.copy(height = maxOf(objectValue.size.height, measured.size.height)))
                      } else objectValue
          '''
          if old not in text:
              raise SystemExit('load sizing anchor missing')
          text = text.replace(old, new)
          controller.write_text(text)

          replace(
              'app/src/main/java/com/neonote/RichContentEditor.kt',
              'import androidx.compose.foundation.layout.fillMaxSize\n',
              'import androidx.compose.foundation.layout.wrapContentHeight\n',
          )
          p = Path('app/src/main/java/com/neonote/RichContentEditor.kt')
          text = p.read_text().replace('modifier = modifier.fillMaxSize().padding(', 'modifier = modifier.fillMaxWidth().wrapContentHeight().padding(')
          text = text.replace('modifier = Modifier.fillMaxSize(),', 'modifier = Modifier.fillMaxWidth().wrapContentHeight(),')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/UnifiedRichTextEditor.kt')
          text = p.read_text()
          text = text.replace('import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.defaultMinSize\nimport androidx.compose.foundation.layout.fillMaxWidth\n')
          text = text.replace('import androidx.compose.material3.Text\n', 'import androidx.compose.material3.Text\nimport androidx.compose.ui.unit.dp\n')
          text = text.replace('            .fillMaxSize()\n            .focusRequester(requester)', '            .fillMaxWidth()\n            .defaultMinSize(minHeight = 48.dp)\n            .focusRequester(requester)')
          text = text.replace('            Box(Modifier.fillMaxSize()) {', '            Box(Modifier.fillMaxWidth().defaultMinSize(minHeight = 48.dp)) {')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/InfiniteCanvasViewport.kt')
          text = p.read_text()
          text = text.replace('import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.widthIn\n')
          text = text.replace('import androidx.compose.ui.platform.LocalContext\n' if 'import androidx.compose.ui.platform.LocalContext\n' in text else 'import androidx.compose.ui.graphics.graphicsLayer\n', 'import androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.layout.onSizeChanged\nimport androidx.compose.ui.platform.LocalDensity\n')
          anchor = '    val platformSnapshotStore = remember { PlatformSnapshotStore() }\n'
          if anchor not in text:
              raise SystemExit('viewport density anchor missing')
          text = text.replace(anchor, anchor + '    val density = LocalDensity.current\n')
          old = '''        modifier = modifier
                      .background(Color(0xFFF9F8FC))
          '''
          new = '''        modifier = modifier
                      .background(Color(0xFFF9F8FC))
                      .onSizeChanged { controller.updateViewportMetrics(it.width, density.density) }
          '''
          if old not in text:
              raise SystemExit('viewport modifier anchor missing')
          text = text.replace(old, new)
          overlay_anchor = '''        if (controller.currentCanvas.objects.isEmpty() && controller.currentCanvas.inkLayer.strokes.isEmpty()) {
          '''
          overlay = '''        val focusedBoxId = controller.state.focusedRichContentBoxId
                  if (controller.state.currentTool == EditorTool.Text && focusedBoxId != null) {
                      RichContentToolbar(
                          boxId = focusedBoxId,
                          controller = controller,
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .padding(horizontal = 12.dp, vertical = 10.dp)
                              .fillMaxWidth()
                              .widthIn(max = 920.dp)
                              .heightIn(min = 50.dp),
                      )
                  }

          '''
          if overlay_anchor not in text:
              raise SystemExit('toolbar overlay anchor missing')
          text = text.replace(overlay_anchor, overlay + overlay_anchor)
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/RichContentToolbar.kt')
          text = p.read_text()
          if 'import androidx.compose.foundation.layout.fillMaxWidth\n' not in text:
              text = text.replace('import androidx.compose.foundation.layout.Box\n', 'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.fillMaxWidth\n')
          text = text.replace('        modifier = modifier.focusProperties { canFocus = false },', '        modifier = modifier.fillMaxWidth().focusProperties { canFocus = false },')
          p.write_text(text)
          PY

          cat > app/src/test/kotlin/com/neonote/RichContentBoxSizingTest.kt <<'KOTLIN'
          package com.neonote

          import com.neonote.model.CanvasPoint
          import com.neonote.model.EditorTool
          import com.neonote.model.RichContentBox
          import kotlin.test.Test
          import kotlin.test.assertTrue

          class RichContentBoxSizingTest {
              @Test
              fun newTextBoxUsesReadableScreenAwareWidth() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(widthPx = 1600, density = 2.5f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))

                  val box = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(box.size.width >= 800f, "text box should not collapse to a narrow strip")
                  assertTrue(box.size.height >= 150f, "text box should have a usable first-line height")
              }

              @Test
              fun measuredComposeContentDrivesAutoHeight() {
                  val controller = NeoNoteEditorController()
                  controller.updateViewportMetrics(widthPx = 1600, density = 2f)
                  controller.setTool(EditorTool.Text)
                  controller.focusOrCreateRichContentBox(CanvasPoint(200f, 200f))
                  val id = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single().id

                  controller.updateRichContentBoxMeasuredHeight(id, 460f)
                  val grown = controller.currentCanvas.objects.filterIsInstance<RichContentBox>().single()
                  assertTrue(grown.size.height >= 460f)
              }
          }
          KOTLIN

      - name: Remove this workflow and commit maintenance result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-maintenance.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: make rich content containers grow with real UI content'
          git push origin HEAD:${FEATURE_BRANCH}

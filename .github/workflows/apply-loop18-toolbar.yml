name: Apply loop 18 table toolbar patch

on:
  push:
    branches: [loop/product-hardening]
    paths: [.github/workflows/apply-loop18-toolbar.yml]

permissions:
  contents: write

concurrency:
  group: neonote-loop18-toolbar
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/product-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed toolbar patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/loop18.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/loop18.patch.b64 > /tmp/loop18.patch
          echo 'aafceed8bee92371b0e5182cc8399cd43d246ee0129050ad476d04ce74930f6b  /tmp/loop18.patch' | sha256sum --check --strict
          git apply --check /tmp/loop18.patch
          git apply /tmp/loop18.patch
          rm .github/workflows/apply-loop18-toolbar.yml
          git diff --check
          git config user.name 'NeoNote hardening loop'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose full table controls in adaptive toolbar'
          git push origin HEAD:loop/product-hardening

name: Apply reviewed hardening loop 7 patch

on:
  push:
    branches: [loop/product-hardening]
    paths: [.github/workflows/apply-loop7.yml]

permissions:
  contents: write

concurrency:
  group: neonote-loop7-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/product-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed patch atomically
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/loop7.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/loop7.patch.b64 > /tmp/loop7.patch
          echo '0d15c2d8ee92496f13458f2827904791ff06029930f7d7d9f61d213c92b796a7  /tmp/loop7.patch' | sha256sum --check --strict
          git apply --check /tmp/loop7.patch
          git apply /tmp/loop7.patch
          rm .github/workflows/apply-loop7.yml
          git diff --check
          git config user.name 'NeoNote hardening loop'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve nested editing history and image memory'
          git push origin HEAD:loop/product-hardening

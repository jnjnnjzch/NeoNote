name: Final product source patch

on:
  push:
    branches:
      - agent/product-quality-loop
    paths:
      - scripts/final_product_patch.py
      - .github/workflows/product-quality-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-quality-loop
          fetch-depth: 0

      - name: Apply narrow final product patches
        run: python3 scripts/final_product_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Final product patches already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git commit -m 'Finish document title and startup interactions'
          git push origin HEAD:agent/product-quality-loop

name: Remove temporary quality infrastructure

on:
  push:
    branches:
      - agent/product-quality-loop
    paths:
      - .github/workflows/product-quality-patch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-quality-loop
          fetch-depth: 0

      - name: Remove temporary patch infrastructure
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/product-quality-patch.yml \
            scripts/product_quality_patch.py \
            scripts/product_quality_patch_v2.py \
            scripts/final_product_patch.py \
            scripts/save_state_patch.py \
            scripts/history_state_patch.py \
            scripts/eraser_priority_patch.py \
            scripts/table_controls_patch.py

      - name: Commit clean product tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary quality patch infrastructure'
          git push origin HEAD:agent/product-quality-loop

name: Restore controller test and apply one-line contract fix

on:
  push:
    branches:
      - agent/product-quality-loop
    paths:
      - .github/workflows/restore-controller-test.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-quality-loop
          fetch-depth: 0

      - name: Restore the exact pre-edit test file
        run: git checkout eb2e8bb5bb21674278a472b096398f739472ecee -- app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt

      - name: Align only the text activation test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        controller.setSelectionMode(false)
                  assertEquals(EditorTool.Pen, controller.state.currentTool)
          
                  controller.activateRichContentBox(boxId)'''
          new = '''        controller.setSelectionMode(false)
                  assertEquals(EditorTool.Pen, controller.state.currentTool)
                  controller.setTool(EditorTool.Text)
          
                  controller.activateRichContentBox(boxId)'''
          if old not in text:
              raise RuntimeError('Target activation test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/restore-controller-test.yml

      - name: Commit the exact targeted change
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt
          git commit -m 'Align text activation test with explicit tool selection'
          git push origin HEAD:agent/product-quality-loop

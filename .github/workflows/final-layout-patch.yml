name: Apply final page rail layout fix

on:
  push:
    branches:
      - agent/product-quality-loop
    paths:
      - scripts/final_layout_patch.py
      - .github/workflows/final-layout-patch.yml

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-quality-loop
          fetch-depth: 0

      - name: Apply layout correction
        run: python3 scripts/final_layout_patch.py

      - name: Remove temporary patch files
        run: |
          git rm -f scripts/final_layout_patch.py .github/workflows/final-layout-patch.yml

      - name: Commit corrected clean tree
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git commit -m 'Fix tablet page rail layout'
          git push origin HEAD:agent/product-quality-loop

name: Temporary NeoNote device APK

on:
  pull_request:
    branches: [codex/neonote-v2-blank-architecture]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: neonote-device-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Build installable device APK
        run: ./gradlew --no-daemon assembleReleaseCandidate

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' -type f | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          mkdir -p device-apk
          "$AAPT" dump badging "$APK" | tee device-apk/badging.txt
          grep -q "package: name='com.neonote.rc'" device-apk/badging.txt
          cp "$APK" device-apk/NeoNote-device-test.apk
          sha256sum device-apk/NeoNote-device-test.apk > device-apk/SHA256SUMS.txt

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: neonote-device-apk
          path: device-apk/
          if-no-files-found: error
          retention-days: 7

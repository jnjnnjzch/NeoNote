name: NeoNote push RC gate

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [ci/trigger-neonote-rc.txt]

permissions:
  contents: write

concurrency:
  group: neonote-push-rc
  cancel-in-progress: false

env:
  FEATURE_BRANCH: feature/complete-editor-rc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve exact document coordinates and update sizing contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_optional(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f"{path}: ambiguous replacement count={count}")
              if count == 1:
                  p.write_text(text.replace(old, new))

          replace_optional(
              'app/src/main/java/com/neonote/NeoNoteEditorController.kt',
              '''    val visibleLeft = -state.viewport.panOffsetX / zoom
              val visibleRight = (viewportWidthScreenPx - state.viewport.panOffsetX) / zoom
              val margin = TextBoxScreenMarginDp * displayDensity / zoom
              val maximumRight = visibleRight - margin
              val overflow = (documentPosition.x + width - maximumRight).coerceAtLeast(0f)
              val position = documentPosition.copy(
                  x = (documentPosition.x - overflow).coerceAtLeast(visibleLeft + margin),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
              '''    // Canvas commands preserve document coordinates exactly. Viewport fitting belongs
              // to the screen/UI layer and must never rewrite persisted object positions.
              val position = documentPosition
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertEquals(320f, multilineBox.size.width)
          ''',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertTrue(multilineBox.size.width >= 640f)
          ''',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertEquals(320f, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
              '''        assertEquals(multilineBox.size.width, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
          )
          PY

          rm -rf ci
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve exact canvas coordinates for text containers'
            git push origin HEAD:${FEATURE_BRANCH}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare outputs
        run: mkdir -p build-logs build-artifacts && chmod +x gradlew

      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-logs/01-unit-tests.log

      - name: Android release lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee build-logs/02-lint.log

      - name: Assemble installable device APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleReleaseCandidate 2>&1 | tee build-logs/03-assemble.log

      - name: Verify APK and collect outputs
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee build-artifacts/badging.txt
          grep -q "package: name='com.neonote.rc'" build-artifacts/badging.txt
          grep -q "versionName='1.0.0-rc.1'" build-artifacts/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build-artifacts/signature.txt
          unzip -t "$APK" > build-artifacts/unzip-test.txt
          cp "$APK" build-artifacts/NeoNote-device-test.apk
          sha256sum build-artifacts/NeoNote-device-test.apk > build-artifacts/SHA256SUMS.txt
          printf 'feature_head=%s\nworkflow_run_id=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > build-artifacts/build-metadata.txt

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: neonote-device-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-device-validation-reports
          path: |
            build-logs/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

name: NeoNote push RC gate

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [ci/trigger-neonote-rc.txt]

permissions:
  contents: write

concurrency:
  group: neonote-push-rc
  cancel-in-progress: false

env:
  FEATURE_BRANCH: feature/complete-editor-rc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0
          persist-credentials: true

      - name: Apply remaining UI sizing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_optional(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f'{path}: ambiguous replacement count={count}')
              if count == 1:
                  p.write_text(text.replace(old, new))

          replace_optional(
              'app/src/main/java/com/neonote/NeoNoteEditorController.kt',
              '''    val maximumLeft = (visibleRight - width - margin).coerceAtLeast(visibleLeft + margin)
              val position = documentPosition.copy(
                  x = documentPosition.x.coerceIn(visibleLeft + margin, maximumLeft),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
              '''    val maximumRight = visibleRight - margin
              val overflow = (documentPosition.x + width - maximumRight).coerceAtLeast(0f)
              val position = documentPosition.copy(
                  x = (documentPosition.x - overflow).coerceAtLeast(visibleLeft + margin),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
          )
          replace_optional(
              'app/src/main/java/com/neonote/NeoNoteEditorController.kt',
              '        size = CanvasSize(width, maxOf(DefaultBoxHeight / zoom, minimumHeight)),',
              '        size = CanvasSize(width, minimumHeight),',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertEquals(320f, multilineBox.size.width)
          ''',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertTrue(multilineBox.size.width >= 640f)
          ''',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertEquals(320f, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
              '''        assertEquals(multilineBox.size.width, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
          )
          PY
          rm -rf ci
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve text anchor and enable visible auto-growth'
            git push origin HEAD:${FEATURE_BRANCH}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare logs
        run: mkdir -p build-logs build-artifacts && chmod +x gradlew
      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-logs/01-unit-tests.log
      - name: Android release lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee build-logs/02-lint.log
      - name: Assemble RC and production APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleReleaseCandidate assembleRelease 2>&1 | tee build-logs/03-assemble.log

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          RC_APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$RC_APK" && test -f "$RELEASE_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$RC_APK" | tee build-artifacts/rc-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee build-artifacts/release-badging.txt
          grep -q "package: name='com.neonote.rc'" build-artifacts/rc-badging.txt
          grep -q "versionName='1.0.0-rc.1'" build-artifacts/rc-badging.txt
          grep -q "package: name='com.neonote'" build-artifacts/release-badging.txt
          grep -q "versionName='1.0.0'" build-artifacts/release-badging.txt
          cp "$RC_APK" build-artifacts/NeoNote-1.0.0-rc.1.apk
          cp "$RELEASE_APK" build-artifacts/NeoNote-1.0.0-unsigned.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-rc
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-reports
          path: |
            build-logs/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "feature_head=$(git rev-parse HEAD)"
            for file in build-logs/*.log; do
              test -f "$file" || continue
              echo "===== $file ====="
              tail -n 1200 "$file"
            done
          } > ci/last-rc-failure.log
          git add ci/last-rc-failure.log
          git commit -m 'ci: record RC failure diagnostics' || true
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Record success metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          cat > ci/last-rc-success.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          feature_head=$(git rev-parse HEAD)
          artifact_name=neonote-complete-editor-rc
          EOF
          git add ci/last-rc-success.txt
          git commit -m 'ci: record successful RC artifact'
          git push origin HEAD:${FEATURE_BRANCH}

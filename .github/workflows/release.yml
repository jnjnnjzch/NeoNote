name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug

      - name: Verify unit tests
        run: ./gradlew :app:testDebugUnitTest

  build-release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebug

      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Sign artifacts (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          jarsigner -keystore keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" app/build/outputs/apk/release/*.apk "$ANDROID_KEY_ALIAS"
          jarsigner -keystore keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" app/build/outputs/bundle/release/*.aab "$ANDROID_KEY_ALIAS"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: table-ink-canvas-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonote-installable-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Generate checksums and metadata
        run: |
          sha256sum app/build/outputs/apk/release/*.apk > release-sha256.txt
          sha256sum app/build/outputs/bundle/release/*.aab >> release-sha256.txt
          ls -lh app/build/outputs/apk/release/*.apk > release-artifacts.txt
          ls -lh app/build/outputs/bundle/release/*.aab >> release-artifacts.txt

      - name: Upload release verification files
        uses: actions/upload-artifact@v4
        with:
          name: table-ink-canvas-release-verification
          path: |
            release-sha256.txt
            release-artifacts.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-sha256.txt
            release-artifacts.txt

name: NeoNote loop source snapshot

on:
  pull_request:
    branches: [codex/neonote-v2-blank-architecture]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Create source snapshot
        run: |
          rm -rf .git
          zip -qr neonote-source.zip . -x 'neonote-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: neonote-loop-source
          path: neonote-source.zip
          if-no-files-found: error
          retention-days: 1

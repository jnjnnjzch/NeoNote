name: NeoNote RC PR gate

on:
  pull_request_target:
    branches: [codex/neonote-v2-blank-architecture]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: neonote-rc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply remaining product fixes
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_optional(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f'{path}: ambiguous replacement count={count}')
              if count == 1:
                  p.write_text(text.replace(old, new))

          replace_optional(
              'app/src/main/java/com/neonote/NeoNoteEditorController.kt',
              '''    val maximumLeft = (visibleRight - width - margin).coerceAtLeast(visibleLeft + margin)
              val position = documentPosition.copy(
                  x = documentPosition.x.coerceIn(visibleLeft + margin, maximumLeft),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
              '''    val maximumRight = visibleRight - margin
              val overflow = (documentPosition.x + width - maximumRight).coerceAtLeast(0f)
              val position = documentPosition.copy(
                  x = (documentPosition.x - overflow).coerceAtLeast(visibleLeft + margin),
              )
              val minimumHeight = MinimumTextBoxHeightDp * displayDensity / zoom
          ''',
          )
          replace_optional(
              'app/src/main/java/com/neonote/NeoNoteEditorController.kt',
              '        size = CanvasSize(width, maxOf(DefaultBoxHeight / zoom, minimumHeight)),',
              '        size = CanvasSize(width, minimumHeight),',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertEquals(320f, multilineBox.size.width)
          ''',
              '''        assertTrue(multilineBox.size.height > RichContentLayoutDefaults.MinimumBoxHeight)
              assertTrue(multilineBox.size.width >= 640f)
          ''',
          )
          replace_optional(
              'app/src/test/kotlin/com/neonote/NeoNoteEditorControllerTest.kt',
              '''        assertEquals(320f, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
              '''        assertEquals(multilineBox.size.width, emptiedBox.size.width)
              assertTrue(emptiedBox.size.height >= RichContentLayoutDefaults.MinimumBoxHeight)
          ''',
          )
          PY

          rm -f ci/last-rc-failure.log
          rmdir ci 2>/dev/null || true
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'fix: preserve text anchor and enable visible auto-growth'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.fix.outputs.changed == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.fix.outputs.changed == 'false'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.fix.outputs.changed == 'false'

      - name: JVM unit tests
        if: steps.fix.outputs.changed == 'false'
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Android release lint
        if: steps.fix.outputs.changed == 'false'
        run: ./gradlew --no-daemon lintRelease

      - name: Assemble RC and production APK
        if: steps.fix.outputs.changed == 'false'
        run: ./gradlew --no-daemon assembleReleaseCandidate assembleRelease

      - name: Verify and collect APKs
        if: steps.fix.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          RC_APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$RC_APK" | tee build-artifacts/rc-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee build-artifacts/release-badging.txt
          grep -q "package: name='com.neonote.rc'" build-artifacts/rc-badging.txt
          grep -q "versionName='1.0.0-rc.1'" build-artifacts/rc-badging.txt
          grep -q "package: name='com.neonote'" build-artifacts/release-badging.txt
          grep -q "versionName='1.0.0'" build-artifacts/release-badging.txt
          cp "$RC_APK" build-artifacts/NeoNote-1.0.0-rc.1.apk
          cp "$RELEASE_APK" build-artifacts/NeoNote-1.0.0-unsigned.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt

      - name: Upload RC artifacts
        if: steps.fix.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-rc
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

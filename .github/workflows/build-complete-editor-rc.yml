name: Build complete editor RC

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [.github/workflows/build-complete-editor-rc.yml]

permissions:
  contents: write

concurrency:
  group: complete-editor-rc
  cancel-in-progress: true

env:
  FEATURE_BRANCH: feature/complete-editor-rc
  DEFAULT_BRANCH: codex/neonote-v2-blank-architecture

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0

      - name: Apply semantic product fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/neonote/NeoNoteEditorController.kt')
          text = p.read_text()
          pattern = re.compile(
              r'(public fun focusOrCreateRichContentBox\(documentPosition: CanvasPoint\) \{.*?)(\n\s*if \(state\.currentTool != EditorTool\.Text\) return)(.*?\n\s*public fun insertFloatingImage)',
              re.S,
          )
          text, count = pattern.subn(r'\1\3', text)
          if count != 1:
              raise SystemExit(f'focusOrCreate semantic replacement count={count}')
          text, page_count = re.subn(r'firstPageId = "page-1",', 'firstPageId = "page-initial",', text, count=1)
          if page_count != 1:
              raise SystemExit(f'initial page id replacement count={page_count}')
          if 'firstSectionId = "section-initial"' not in text:
              text, section_count = re.subn(
                  r'(documentId = "default-document",\s*\n\s*firstPageId = "page-initial",)',
                  r'\1\n        firstSectionId = "section-initial",',
                  text,
                  count=1,
              )
              if section_count != 1:
                  raise SystemExit(f'initial section id replacement count={section_count}')
          p.write_text(text)

          p = Path('app/src/main/java/com/neonote/engine/DocumentSearch.kt')
          text = p.read_text()
          text = text.replace('.joinToString("\\n")\n        .lowercase()', '.joinToString("\\n")\n        .normalizedSearchText()')
          text = text.replace('val normalized = lowercase()', 'val normalized = normalizedSearchText()')
          old = '''private fun String.normalizedTerms(): List<String> = trim()
              .lowercase()
              .split(Regex("\\\\s+"))
              .map(String::trim)
              .filter(String::isNotEmpty)
              .distinct()
              .take(MaximumSearchTerms)'''
          new = '''private fun String.normalizedTerms(): List<String> = normalizedSearchText()
              .split(Regex("\\\\s+"))
              .map(String::trim)
              .filter(String::isNotEmpty)
              .distinct()
              .take(MaximumSearchTerms)

          private fun String.normalizedSearchText(): String = lowercase()
              .replace(Regex("[\\\\{}_]+"), " ")
              .replace(Regex("[^\\p{L}\\p{N}]+"), " ")
              .replace(Regex("\\\\s+"), " ")
              .trim()'''
          if old in text:
              text = text.replace(old, new)
          elif 'private fun String.normalizedSearchText()' not in text:
              raise SystemExit('search normalization source not found')
          p.write_text(text)

          p = Path('app/src/test/kotlin/com/neonote/RichContentRendererTest.kt')
          text = p.read_text()
          pattern = re.compile(r'    @Test\n\s*fun `paragraph renderer emits visible chips for inline formula and image`\(\) \{.*?\n\s*\}\n\n\s*@Test', re.S)
          replacement = '''    @Test
              fun `paragraph renderer emits visible chips for inline formula and image`() {
                  val paragraph = ParagraphNode(
                      inlines = listOf(
                          InlineText("before"),
                          InlineFormula("x^2"),
                          InlineLineBreak,
                          InlineImage(assetId = "asset-42", altText = "diagram"),
                      ),
                  )
                  val annotated = paragraph.toDisplayAnnotatedString()
                  val chipSpans = annotated.spanStyles.filter { it.item.background != Color.Unspecified }
                  assertEquals(2, chipSpans.size)
                  assertTrue(annotated.text.startsWith("before"))
                  assertTrue(annotated.text.contains("x"))
                  assertTrue(annotated.text.contains("Image: diagram"))
              }

              @Test'''
          text, count = pattern.subn(replacement, text)
          if count not in (0, 1):
              raise SystemExit(f'renderer test replacement count={count}')
          p.write_text(text)
          PY

          rm -f ci/last-rc-failure.log
          rmdir ci 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: restore explicit text creation and normalize formula search'
          git push origin HEAD:${FEATURE_BRANCH}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare logs
        run: mkdir -p build-logs build-artifacts && chmod +x gradlew
      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-logs/01-unit-tests.log
      - name: Android release lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee build-logs/02-lint.log
      - name: Assemble installable RC and unsigned production APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleReleaseCandidate assembleRelease 2>&1 | tee build-logs/03-assemble.log
      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          RC_APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$RC_APK" && test -f "$RELEASE_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$RC_APK" | tee build-artifacts/rc-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee build-artifacts/release-badging.txt
          grep -q "package: name='com.neonote.rc'" build-artifacts/rc-badging.txt
          grep -q "versionName='1.0.0-rc.1'" build-artifacts/rc-badging.txt
          grep -q "package: name='com.neonote'" build-artifacts/release-badging.txt
          grep -q "versionName='1.0.0'" build-artifacts/release-badging.txt
          cp "$RC_APK" build-artifacts/NeoNote-1.0.0-rc.1.apk
          cp "$RELEASE_APK" build-artifacts/NeoNote-1.0.0-unsigned.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt
      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-rc
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-reports
          path: |
            build-logs/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit actionable failure log
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "RC build failed for feature head $(git rev-parse HEAD)"
            for file in build-logs/*.log; do
              test -f "$file" || continue
              echo "===== $file ====="
              tail -n 1000 "$file"
            done
          } > ci/last-rc-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/last-rc-failure.log
          git commit -m 'ci: record complete editor RC failure' || true
          git push origin HEAD:${FEATURE_BRANCH}
      - name: Record successful artifact metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/last-rc-failure.log
          mkdir -p ci
          cat > ci/last-rc-success.txt <<EOF
          feature_head=$(git rev-parse HEAD)
          workflow_run_id=${GITHUB_RUN_ID}
          artifact_name=neonote-complete-editor-rc
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: record successful complete-editor RC artifact'
          git push origin HEAD:${FEATURE_BRANCH}
      - name: Remove successful one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${DEFAULT_BRANCH}
          git checkout -B ${DEFAULT_BRANCH} origin/${DEFAULT_BRANCH}
          git rm .github/workflows/build-complete-editor-rc.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove successful RC build workflow'
          git push origin HEAD:${DEFAULT_BRANCH}

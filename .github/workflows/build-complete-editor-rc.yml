name: Build complete editor RC

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [.github/workflows/build-complete-editor-rc.yml]

permissions:
  contents: write

concurrency:
  group: complete-editor-rc
  cancel-in-progress: true

env:
  FEATURE_BRANCH: feature/complete-editor-rc
  DEFAULT_BRANCH: codex/neonote-v2-blank-architecture

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0

      - name: Apply guarded compiler and test fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_optional(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f"{path}: ambiguous replacement ({count} matches)")
              if count == 1:
                  p.write_text(text.replace(old, new))

          replace_optional('app/src/main/java/com/neonote/NeoNoteWorkspaceChrome.kt',
              'import androidx.compose.foundation.background\n',
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n')
          replace_optional('app/src/main/java/com/neonote/UnifiedRichTextEditor.kt',
              'textColorArgb?.let(::androidx.compose.ui.graphics.Color)', 'textColorArgb?.let(::Color)')
          replace_optional('app/src/main/java/com/neonote/UnifiedRichTextEditor.kt',
              'highlightColorArgb?.let(::androidx.compose.ui.graphics.Color)', 'highlightColorArgb?.let(::Color)')
          replace_optional('app/src/main/java/com/neonote/engine/RichContentEditorSession.kt',
              'pendingCommands.also(mutablePendingCommands::clear)',
              'pendingCommands.also { mutablePendingCommands.clear() }')
          replace_optional('app/src/main/java/com/neonote/engine/SelectionEngine.kt',
              '.mapNotNull(InkStroke::boundsOrNull)', '.mapNotNull { it.boundsOrNull() }')
          replace_optional('app/src/main/java/com/neonote/engine/SelectionEngine.kt',
              'stroke.points.map(InkPoint::toCanvasPoint)', 'stroke.points.map { it.toCanvasPoint() }')

          replace_optional(
              'app/src/test/kotlin/com/neonote/CompleteRichContentEngineTest.kt',
              '''        val outer = TableNode(rows = listOf(listOf(
              TableCell(content = RichContent(listOf(nested))),
              TableCell(content = RichContent(listOf(ParagraphNode(listOf(InlineText("sibling"))))))),
          )))''',
              '''        val outer = TableNode(
              rows = listOf(
                  listOf(
                      TableCell(content = RichContent(listOf(nested))),
                      TableCell(content = RichContent(listOf(ParagraphNode(listOf(InlineText("sibling")))))),
                  ),
              ),
          )''',
          )
          replace_optional('app/src/test/kotlin/com/neonote/NeoNoteArchiveTest.kt',
              'import kotlin.test.assertContentEquals\n', '')
          replace_optional('app/src/test/kotlin/com/neonote/NeoNoteArchiveTest.kt',
              '''            assertContentEquals(
                  setOf(firstBytes.toList(), secondBytes.toList()),
                  importedReferences.map { java.io.File(requireNotNull(it.uri)).readBytes().toList() }.toSet(),
              )''',
              '''            assertEquals(
                  setOf(firstBytes.toList(), secondBytes.toList()),
                  importedReferences.map { java.io.File(requireNotNull(it.uri)).readBytes().toList() }.toSet(),
              )''')
          replace_optional('app/src/test/kotlin/com/neonote/RichContentRendererTest.kt',
              '''    @Test
              fun `inline placeholder helpers fall back to stable labels`() {
                  assertEquals(" ƒ empty ", InlineFormula("").formulaChipText())
                  assertEquals(" Image: asset:asset-42 ", InlineImage(assetId = "asset-42").imageChipText())
              }''',
              '''    @Test
              fun `inline placeholders fall back to stable labels`() {
                  val annotated = ParagraphNode(
                      inlines = listOf(
                          InlineFormula(""),
                          InlineImage(assetId = "asset-42"),
                      ),
                  ).toDisplayAnnotatedString()
                  assertEquals(" ƒ empty  Image: asset:asset-42 ", annotated.text)
              }''')
          PY
          rm -f ci/last-rc-failure.log
          rmdir ci 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align complete-editor tests with production behavior'
            git push origin HEAD:${FEATURE_BRANCH}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare logs
        run: mkdir -p build-logs build-artifacts && chmod +x gradlew

      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build-logs/01-unit-tests.log

      - name: Android release lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee build-logs/02-lint.log

      - name: Assemble installable RC and unsigned production APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleReleaseCandidate assembleRelease 2>&1 | tee build-logs/03-assemble.log

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          RC_APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$RC_APK" && test -f "$RC_APK"
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$RC_APK" | tee build-artifacts/rc-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee build-artifacts/release-badging.txt
          grep -q "package: name='com.neonote.rc'" build-artifacts/rc-badging.txt
          grep -q "versionName='1.0.0-rc.1'" build-artifacts/rc-badging.txt
          grep -q "package: name='com.neonote'" build-artifacts/release-badging.txt
          grep -q "versionName='1.0.0'" build-artifacts/release-badging.txt
          cp "$RC_APK" build-artifacts/NeoNote-1.0.0-rc.1.apk
          cp "$RELEASE_APK" build-artifacts/NeoNote-1.0.0-unsigned.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-rc
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-reports
          path: |
            build-logs/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit actionable failure log
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "RC build failed for feature head $(git rev-parse HEAD)"
            echo
            for file in build-logs/*.log; do
              test -f "$file" || continue
              echo "===== $file ====="
              tail -n 800 "$file"
              echo
            done
          } > ci/last-rc-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/last-rc-failure.log
          git commit -m 'ci: record complete editor RC failure' || true
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Remove successful one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/last-rc-failure.log
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'ci: clear previous RC failure diagnostics'
            git push origin HEAD:${FEATURE_BRANCH}
          fi
          git fetch origin ${DEFAULT_BRANCH}
          git checkout -B ${DEFAULT_BRANCH} origin/${DEFAULT_BRANCH}
          git rm .github/workflows/build-complete-editor-rc.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove successful RC build workflow'
          git push origin HEAD:${DEFAULT_BRANCH}

name: Build complete editor RC

on:
  push:
    branches: [codex/neonote-v2-blank-architecture]
    paths: [.github/workflows/build-complete-editor-rc.yml]

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/complete-editor-rc
  DEFAULT_BRANCH: codex/neonote-v2-blank-architecture

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-editor-rc
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Assemble installable RC and unsigned production APK
        run: ./gradlew --no-daemon assembleReleaseCandidate assembleRelease

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          RC_APK=$(find app/build/outputs/apk/releaseCandidate -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$RC_APK" && test -f "$RC_APK"
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$RC_APK" | tee /tmp/rc-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee /tmp/release-badging.txt
          grep -q "package: name='com.neonote.rc'" /tmp/rc-badging.txt
          grep -q "versionName='1.0.0-rc.1'" /tmp/rc-badging.txt
          grep -q "package: name='com.neonote'" /tmp/release-badging.txt
          grep -q "versionName='1.0.0'" /tmp/release-badging.txt
          mkdir -p build-artifacts
          cp "$RC_APK" build-artifacts/NeoNote-1.0.0-rc.1.apk
          cp "$RELEASE_APK" build-artifacts/NeoNote-1.0.0-unsigned.apk
          cp /tmp/rc-badging.txt /tmp/release-badging.txt build-artifacts/
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-rc
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonote-complete-editor-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove successful one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${DEFAULT_BRANCH}
          git checkout -B ${DEFAULT_BRANCH} origin/${DEFAULT_BRANCH}
          git rm .github/workflows/build-complete-editor-rc.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove successful RC build workflow'
          git push origin HEAD:${DEFAULT_BRANCH}

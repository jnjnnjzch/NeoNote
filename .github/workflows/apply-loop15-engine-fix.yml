name: Apply loop 15 table engine fix

on:
  push:
    branches: [loop/product-hardening]
    paths: [.github/workflows/apply-loop15-engine-fix.yml]

permissions:
  contents: write

concurrency:
  group: neonote-loop15-engine-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/product-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed engine patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/loop15.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/loop15.patch.b64 > /tmp/loop15.patch
          echo 'fe11a20f0b24dbe0ad3b5536e972d3255a057e09d08780ed7b177ce70d48bf8d  /tmp/loop15.patch' | sha256sum --check --strict
          git apply --check /tmp/loop15.patch
          git apply /tmp/loop15.patch
          rm .github/workflows/apply-loop15-engine-fix.yml
          git diff --check
          git config user.name 'NeoNote hardening loop'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clear merged spans before table structure edits'
          git push origin HEAD:loop/product-hardening
